name: Gym Ecosystem Container

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ecosystem.lock.toml"
      - ".gitmodules"
      - "scripts/container-smoke.sh"
      - "scripts/verify-provenance.sh"
      - ".github/workflows/gym-ecosystem-container.yml"
      - "vendor/**"
  push:
    branches: [main]
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:

concurrency:
  group: gym-ecosystem-container
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ggen_sha: ${{ steps.lock.outputs.ggen_sha }}
    steps:
      - name: Checkout exact subject with direct submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: true
      - name: Prove exact subject and direct provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          ./scripts/verify-provenance.sh
      - name: Bind exact ggen manufacturer pin
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open('ecosystem.lock.toml', 'rb') as f:
              doc = tomllib.load(f)
          print('ggen_sha=' + doc['submodules']['ggen_ecosystem_commit'])
          PY
      - name: Prove customer manufacturer surface
        shell: bash
        run: |
          set -euo pipefail
          vendor/ggen-ecosystem/bin/ggen-ecosystem --help | grep -q manufacture
          docker buildx build --check -f Dockerfile .
          echo GYM_ECOSYSTEM_PREFLIGHT_ALIVE

  build-amd64:
    if: github.event_name != 'pull_request'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact subject with direct submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: true
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push linux/amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          sbom: true
          provenance: true
          build-args: |
            GGEN_ECOSYSTEM_IMAGE=ghcr.io/seanchatmangpt/ggen-ecosystem:sha-${{ needs.preflight.outputs.ggen_sha }}
            SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=gym-ecosystem-amd64
          cache-to: type=gha,mode=max,scope=gym-ecosystem-amd64
          tags: ghcr.io/seanchatmangpt/gym-ecosystem:sha-${{ github.sha }}-amd64

  build-arm64:
    if: github.event_name != 'pull_request'
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact subject with direct submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: true
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push linux/arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          sbom: true
          provenance: true
          build-args: |
            GGEN_ECOSYSTEM_IMAGE=ghcr.io/seanchatmangpt/ggen-ecosystem:sha-${{ needs.preflight.outputs.ggen_sha }}
            SOURCE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=gym-ecosystem-arm64
          cache-to: type=gha,mode=max,scope=gym-ecosystem-arm64
          tags: ghcr.io/seanchatmangpt/gym-ecosystem:sha-${{ github.sha }}-arm64

  merge-manifest:
    if: github.event_name != 'pull_request'
    needs: [preflight, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout receipt inputs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA}"
          IMAGE="ghcr.io/seanchatmangpt/gym-ecosystem:${TAG}"
          docker buildx imagetools create \
            -t "$IMAGE" \
            -t "ghcr.io/seanchatmangpt/gym-ecosystem:main" \
            -t "ghcr.io/seanchatmangpt/gym-ecosystem:latest" \
            "ghcr.io/seanchatmangpt/gym-ecosystem:${TAG}-amd64" \
            "ghcr.io/seanchatmangpt/gym-ecosystem:${TAG}-arm64"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format "{{json .Manifest}}" | jq -r '.digest')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign multi-arch crown keylessly
        shell: bash
        run: cosign sign --yes "${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}"
      - name: Run Trivy on published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.manifest.outputs.image }}
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
      - name: Pull and execute exact published image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${{ steps.manifest.outputs.image }}"
          docker run --rm "${{ steps.manifest.outputs.image }}" bash -lc './scripts/container-smoke.sh'
      - name: Bind publication receipt
        shell: bash
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          GGEN_SHA: ${{ needs.preflight.outputs.ggen_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gym-container"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          lock = Path('ecosystem.lock.toml').read_bytes()
          receipt = {
              'schema': 'https://ggen.dev/receipts/gym-ecosystem-container/v1',
              'source_sha': os.environ['GITHUB_SHA'],
              'image': os.environ['IMAGE'],
              'digest': os.environ['DIGEST'],
              'ggen_ecosystem_sha': os.environ['GGEN_SHA'],
              'lock_sha256': hashlib.sha256(lock).hexdigest(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'standing': 'ALIVE',
          }
          p = Path(os.environ['RUNNER_TEMP']) / 'gym-container' / 'receipt.json'
          p.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gym-ecosystem-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gym-container/
          retention-days: 30
          if-no-files-found: error
