name: Autonomic Crown

on:
  pull_request:
    paths:
      - "scripts/crown-submodules.py"
      - ".github/workflows/autonomic-crown.yml"
      - ".github/workflows/gym-ecosystem-container.yml"
      - ".gitmodules"
      - "ecosystem.lock.toml"
      - "Dockerfile"
      - "scripts/container-smoke.sh"
  push:
    branches: [main]
    paths:
      - "scripts/crown-submodules.py"
      - ".github/workflows/autonomic-crown.yml"
      - ".github/workflows/gym-ecosystem-container.yml"
      - ".gitmodules"
      - "ecosystem.lock.toml"
      - "Dockerfile"
      - "scripts/container-smoke.sh"
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:

concurrency:
  group: gym-autonomic-crown
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-reconciler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Compile and observe crown plan without writes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m py_compile scripts/crown-submodules.py
          python3 scripts/crown-submodules.py --receipt "$RUNNER_TEMP/crown-plan.json"
          git diff --exit-code
          docker buildx build --check -f Dockerfile .
          echo GYM_AUTONOMIC_CROWN_RECONCILER_ALIVE
      - name: Upload observation receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gym-crown-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crown-plan.json
          retention-days: 14
          if-no-files-found: error

  reconcile:
    if: github.event_name != 'pull_request'
    needs: validate-reconciler
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      pull-requests: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main with write authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Reconcile all reference/control-plane repositories
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autonomic-crown"
          BASE="$(git rev-parse HEAD)"
          python3 scripts/crown-submodules.py --apply --receipt "$RUNNER_TEMP/autonomic-crown/plan.json"
          git add ecosystem.lock.toml
          while read -r _ path; do
            [[ -n "$path" ]] && git add -- "$path"
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "GYM_AUTONOMIC_CROWN_NOOP_ALIVE $BASE"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Create isolated crown candidate and PR
        if: steps.reconcile.outputs.changed == 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="automation/crown-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m 'chore(crown): reconcile gym ecosystem heads'
          CANDIDATE="$(git rev-parse HEAD)"
          git push --set-upstream origin "$BRANCH"
          for stale in $(gh pr list --state open --limit 20 --json number,title --jq '.[] | select(.title == "chore(crown): reconcile gym ecosystem heads") | .number'); do
            gh pr close "$stale" --comment "Superseded by autonomic crown run ${GITHUB_RUN_ID}." --delete-branch || true
          done
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title 'chore(crown): reconcile gym ecosystem heads' --body "Autonomic gym crown candidate manufactured by run ${GITHUB_RUN_ID}. Exact provenance and container execution are verified before merge.")"
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
          echo "GYM_CROWN_CANDIDATE $CANDIDATE"

      - name: Execute exact candidate provenance and container court
        if: steps.reconcile.outputs.changed == 'true'
        id: court
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE="${{ steps.candidate.outputs.candidate }}"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git submodule sync
          git submodule update --init --depth 1
          ./scripts/verify-provenance.sh
          vendor/ggen-ecosystem/bin/ggen-ecosystem --help | grep -q manufacture
          GGEN_SHA="$(python3 - <<'PY'
          import tomllib
          with open('ecosystem.lock.toml','rb') as f: d=tomllib.load(f)
          print(d['submodules']['ggen_ecosystem_commit'])
          PY
          )"
          BASE_IMAGE="ghcr.io/seanchatmangpt/ggen-ecosystem:sha-${GGEN_SHA}"
          for _ in $(seq 1 30); do
            docker manifest inspect "$BASE_IMAGE" >/dev/null 2>&1 && break
            sleep 10
          done
          docker manifest inspect "$BASE_IMAGE" >/dev/null
          docker build --build-arg "GGEN_ECOSYSTEM_IMAGE=$BASE_IMAGE" --build-arg "SOURCE_SHA=$CANDIDATE" -t gym-ecosystem:crown .
          docker run --rm gym-ecosystem:crown bash -lc './scripts/container-smoke.sh'
          echo "ggen_sha=$GGEN_SHA" >> "$GITHUB_OUTPUT"
          echo "GYM_AUTONOMIC_CROWN_CHICAGO_ALIVE $CANDIDATE ggen=$GGEN_SHA"

      - name: Merge exact candidate and prove containment
        if: steps.reconcile.outputs.changed == 'true'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.candidate.outputs.pr_number }}"
          CANDIDATE="${{ steps.candidate.outputs.candidate }}"
          gh pr merge "$PR" --merge --delete-branch
          git fetch origin main
          git merge-base --is-ancestor "$CANDIDATE" origin/main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "GYM_AUTONOMIC_CROWN_CONTAINMENT_ALIVE candidate=$CANDIDATE main=$MAIN_SHA"

      - name: Resume gym ecosystem container publication
        if: steps.reconcile.outputs.changed == 'true'
        id: resume
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="${{ steps.merge.outputs.main_sha }}"
          STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run gym-ecosystem-container.yml --ref main
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow gym-ecosystem-container.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt \
              | jq -r --arg sha "$MAIN_SHA" --arg started "$STARTED" '.[] | select(.headSha == $sha and .createdAt >= $started) | .databaseId' | head -1)"
            [[ -n "$RUN_ID" ]] && break
            sleep 2
          done
          [[ -n "$RUN_ID" ]] || { echo 'GYM_CROWN_BLOCKED[CONTAINER_RESUME_NOT_OBSERVED]' >&2; exit 1; }
          gh run watch "$RUN_ID" --exit-status --interval 10
          echo "container_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "GYM_AUTONOMIC_CROWN_RESUME_ALIVE run=$RUN_ID main=$MAIN_SHA"

      - name: Bind closure receipt
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.reconcile.outputs.changed }}
          BASE_SHA: ${{ steps.reconcile.outputs.base }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          MAIN_SHA: ${{ steps.merge.outputs.main_sha }}
          CONTAINER_RUN_ID: ${{ steps.resume.outputs.container_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autonomic-crown"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              'schema':'https://ggen.dev/receipts/gym-autonomic-crown-closure/v1',
              'repository':os.environ['GITHUB_REPOSITORY'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'base_sha':os.environ.get('BASE_SHA',''),
              'changed':os.environ.get('CHANGED','false') == 'true',
              'candidate_sha':os.environ.get('CANDIDATE_SHA',''),
              'pr_number':os.environ.get('PR_NUMBER',''),
              'main_sha':os.environ.get('MAIN_SHA',''),
              'container_run_id':os.environ.get('CONTAINER_RUN_ID',''),
          }
          receipt['standing']='ALIVE' if (not receipt['changed'] or (receipt['candidate_sha'] and receipt['main_sha'] and receipt['container_run_id'])) else 'BLOCKED'
          p=Path(os.environ['RUNNER_TEMP'])/'autonomic-crown'/'closure.json'
          p.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          if receipt['standing'] != 'ALIVE': raise SystemExit('GYM_AUTONOMIC_CROWN_BLOCKED')
          PY

      - name: Upload crown receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gym-autonomic-crown-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autonomic-crown/
          retention-days: 30
          if-no-files-found: error
