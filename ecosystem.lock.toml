[composition]
consumer_boundary = "gym-ecosystem"
execution_kernel = "vendor/gymact"
planning_lab = "vendor/autofde-lab"
gym_catalog = "all owner-visible repositories whose names contain gym, excluding gym-ecosystem itself"
software_manufacturing = "vendor/ggen-ecosystem"
process_intelligence = "vendor/beam4pm"
rule = "downstream customers integrate manufactured gym products; direct vendor pins are internal ecosystem/reference concerns"

[manufacturing]
manufacturer = "vendor/ggen-ecosystem"
command = "vendor/ggen-ecosystem/bin/ggen-ecosystem manufacture <customer-project-dir>"
customer_inputs = "ggen.toml + ontology.ttl + admitted packs/templates"
reference_corpus = "vendor/*gym* plus vendor/SREGym"
output_contract = "independent downstream customer gym projection"
source_ownership_rule = "customer source is manufactured from admitted specification; generated projections are not an editing/ownership surface"

[simulation]
episode_equation = "World x Roles x Policies x InformationPartitions x Authority x Parameters"
default_authority = "SIMULATION_ONLY"
production_actuation = "BRCE_REQUIRED"
